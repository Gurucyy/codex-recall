name: desktop-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build desktop package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop bundle
        run: pnpm tauri build

      - name: Upload macOS workflow artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: codex-recall-macos
          path: |
            target/release/bundle/macos/*.app
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload Windows workflow artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: codex-recall-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

  release:
    name: Publish GitHub Release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List release assets
        run: find dist -maxdepth 4 -type f -print

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/codex-recall-macos/**/*.dmg
            dist/codex-recall-windows/**/*.exe
            dist/codex-recall-windows/**/*.msi
